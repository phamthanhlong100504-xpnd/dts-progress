spring:
  application:
    name: progress-service-test
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///dts_progress_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
  main:
    lazy-initialization: false

jwt:
  access-secret: test-secret-key-for-jwt-validation-12345678901234567890123456789012
  issuer: dts-identity-service
