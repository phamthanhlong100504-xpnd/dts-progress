services:
  postgres:
    image: postgres:16-alpine
    container_name: dts-progress-postgres
    ports:
      - "${DB_EXTERNAL_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-dts_progress}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - progress_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-dts_progress}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dts-network

volumes:
  progress_postgres_data:

networks:
  dts-network:
    driver: bridge
