name: Build & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/progress-service
  DEPLOY_DIR: /dts/progress-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Unit Tests
        run: mvn clean test -B

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/surefire-reports/TEST-*.xml
            **/failsafe-reports/TEST-*.xml

      - name: Build Jar
        run: mvn clean package -B -DskipTests

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          docker build \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Create deploy directory on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.prod.yml"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          KAFKA_HOST: ${{ secrets.KAFKA_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: DB_PASSWORD,JWT_ACCESS_SECRET,KAFKA_HOST,GITHUB_TOKEN
          script: |
            docker network create dts-network || true
            cd ${{ env.DEPLOY_DIR }}
            mv -f docker-compose.prod.yml docker-compose.yml
            export GITHUB_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            sed -i "s/${GITHUB_OWNER}/$GITHUB_OWNER/g" docker-compose.yml
            echo "GITHUB_REPOSITORY_OWNER=$GITHUB_OWNER" > .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET" >> .env
            echo "KAFKA_HOST=$KAFKA_HOST" >> .env
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u $GITHUB_OWNER --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -a -f
