services:
  progress-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dts-progress-service
    ports:
      - "${SERVER_PORT:-8083}:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=dts-progress-postgres
      - DB_PORT=5432
      - DB_NAME=dts_progress
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ISSUER=dts-identity-service
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_URI=${EUREKA_URI:-http://eureka-server:8761/eureka}
      - EUREKA_ENABLED=${EUREKA_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dts-network
      - dts-identity-network

  postgres:
    image: postgres:16-alpine
    container_name: dts-progress-postgres
    ports:
      - "${DB_EXTERNAL_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-dts_progress}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - progress_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-dts_progress}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dts-network

volumes:
  progress_postgres_data:

networks:
  dts-network:
    driver: bridge
  dts-identity-network:
    external: true
    name: dts-identity_dts-network
